<!-- ============ 04 TRUST ============ -->
<section class="trust" aria-label="Почему мы">
  <div class="trust__card">
    <svg class="trust__contours" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>
    <p class="label label--on-dark" data-reveal>05 — Без посредников</p>
    <div class="trust__grid">
      <div class="trust__item" data-reveal>
        <p class="trust__big">Цех</p>
        <h3>Напрямую с производства</h3>
        <p>Без салонов и наценок. Свой стол можно увидеть в цеху до отгрузки.</p>
      </div>
      <div class="trust__item" data-reveal>
        <p class="trust__big">Юг</p>
        <h3>Замер и монтаж</h3>
        <p>Краснодар и край. Приезжаем, смотрим основание, считаем нагрузку.</p>
      </div>
      <div class="trust__item" data-reveal>
        <p class="trust__big">15 <small>мин</small></p>
        <h3>Индивидуальный расчёт</h3>
        <p>Пришлите размеры или фото места — ответим с ценой и сроками.</p>
      </div>
    </div>
  </div>
</section>
